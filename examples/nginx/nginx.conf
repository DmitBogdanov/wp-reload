# nginx.conf — минимальный пример конфигурации для отдачи статических
# страниц проекта (examples/html, docs) через Nginx.
#
# Проверка синтаксиса: nginx -t -c /path/to/nginx.conf
#
# Примечание: сам корневой index.php требует PHP-обработчика (php-fpm или
# apache+mod_php — см. Dockerfile в корне проекта). Эта конфигурация
# рассчитана на статические файлы, например examples/html/index.html.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location ~* \.(css|js|svg|png|jpg|jpeg|webp|avif)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location = /robots.txt {
            add_header Content-Type text/plain;
        }

        location = /sitemap-information.xml {
            add_header Content-Type application/xml;
        }
    }
}
